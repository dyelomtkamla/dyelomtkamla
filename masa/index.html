<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>ماسة الشقية</title>
<meta name="description" content="ماسة الشقية - لعبة عائلية مرحة: ساعد ماسة تلقط الحلويات وتهرب من الخضار!"/>
<meta name="theme-color" content="#ff7eb6"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@500;800&display=swap" rel="stylesheet"/>
<style>
  :root{
    --pink:#ff7eb6; --pink-deep:#e2508f; --lime:#8fdc2a; --sky:#bfe7ff;
    --cream:#fff7ec; --ink:#3a2340; --gold:#f5c542;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden;background:var(--sky);font-family:'Tajawal',sans-serif;color:var(--ink);
    touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block;width:100vw;height:100dvh}
  .hud{position:fixed;top:0;inset-inline:0;display:flex;justify-content:space-between;align-items:center;
    padding:calc(10px + env(safe-area-inset-top)) 16px 10px;pointer-events:none;font-family:'Lalezar',cursive;font-size:22px}
  .pill{background:rgba(255,255,255,.85);border-radius:999px;padding:4px 14px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
  .hud button{pointer-events:auto;border:0;background:rgba(255,255,255,.85);border-radius:50%;width:40px;height:40px;
    font-size:18px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.08)}
  .screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;
    background:rgba(255,126,182,.35);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .screen.hidden{display:none}
  .card{background:var(--cream);border-radius:28px;padding:24px 20px;max-width:380px;width:100%;text-align:center;
    box-shadow:0 8px 0 var(--pink-deep),0 20px 40px rgba(0,0,0,.18);border:4px solid #fff}
  .card h1{font-family:'Lalezar',cursive;font-weight:400;font-size:46px;line-height:1.1;color:var(--pink-deep);
    text-shadow:0 3px 0 #fff,0 5px 0 rgba(0,0,0,.08)}
  .card h1 span{color:#5cae0c}
  .card p{font-size:16px;margin:10px 0 4px;line-height:1.7}
  .legend{display:flex;justify-content:center;gap:14px;margin:10px 0 2px;font-size:15px;flex-wrap:wrap}
  .legend b{font-size:22px;display:block}
  .btn{display:block;width:100%;margin-top:14px;border:0;border-radius:18px;padding:14px;font-family:'Lalezar',cursive;
    font-size:26px;color:#fff;background:var(--pink);box-shadow:0 6px 0 var(--pink-deep);cursor:pointer}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--pink-deep)}
  .btn.alt{font-family:'Tajawal',sans-serif;font-weight:800;font-size:15px;color:var(--ink);background:#fff;
    box-shadow:0 4px 0 #e6d6c8;padding:10px}
  #avatar{width:150px;height:150px;margin:6px auto 0;display:block}
  .best{font-family:'Lalezar',cursive;font-size:20px;color:#5cae0c;margin-top:6px}
  .big{font-family:'Lalezar',cursive;font-size:56px;color:var(--pink-deep);line-height:1}
  .note{font-size:12px;opacity:.65;margin-top:8px}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div class="hud">
  <div class="pill" id="score">⭐ 0</div>
  <div class="pill" id="lives">❤️❤️❤️</div>
  <button id="muteBtn" aria-label="الصوت">🔊</button>
</div>

<div class="screen" id="startScreen">
  <div class="card">
    <canvas id="avatar" width="300" height="300"></canvas>
    <h1>ماسة <span>الشقية</span></h1>
    <p>ماسة بتحب الحلويات جدًا 😋<br/>حرّكها يمين وشمال عشان تلقط الحلو وتهرب من الخضار!</p>
    <div class="legend">
      <div><b>🍭🍬🍓🧁</b>نقط</div>
      <div><b>💎</b>ماسة = ٥٠!</div>
      <div><b>🥦🧅🌶️</b>إيييع</div>
    </div>
    <button class="btn" id="playBtn">يلا نلعب!</button>
    <button class="btn alt" id="photoBtn">📷 حط صورة ماسة الحقيقية</button>
    <input type="file" id="photoInput" accept="image/*" hidden/>
    <div class="best" id="bestStart"></div>
    <div class="note">الصورة بتفضل على جهازك بس، مش بتترفع لأي مكان.</div>
  </div>
</div>

<div class="screen hidden" id="overScreen">
  <div class="card">
    <h1>خلصت اللعبة!</h1>
    <p id="overMsg">ماسة شبعت حلويات 🍭</p>
    <div class="big" id="finalScore">0</div>
    <div class="best" id="bestOver"></div>
    <button class="btn" id="againBtn">تاني! تاني!</button>
    <button class="btn alt" id="homeBtn">الرئيسية</button>
  </div>
</div>

<script>
(() => {
  const cv = document.getElementById('game'), ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);
  let W = 0, H = 0, DPR = 1;

  const store = {
    get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
    set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
    del(k){ try { localStorage.removeItem(k); } catch(e){} }
  };

  // ---------- Optional real photo (kept on device only) ----------
  let photo = null;
  function loadPhoto(src){
    const img = new Image();
    img.onload = () => { photo = img; drawAvatar(); };
    img.src = src;
  }
  const saved = store.get('masa-photo');
  if (saved) loadPhoto(saved);

  $('photoBtn').onclick = () => {
    if (photo) { photo = null; store.del('masa-photo'); drawAvatar(); return; }
    $('photoInput').click();
  };
  $('photoInput').onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        // square crop around the upper-middle of the photo (where the face usually is), downscaled
        const S = 320, c = document.createElement('canvas'); c.width = c.height = S;
        const side = Math.min(img.width, img.height) * 0.7;
        const sx = (img.width - side) / 2, sy = Math.max(0, img.height * 0.42 - side / 2);
        c.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, S, S);
        const url = c.toDataURL('image/jpeg', 0.85);
        store.set('masa-photo', url);
        loadPhoto(url);
      };
      img.src = r.result;
    };
    r.readAsDataURL(f);
    e.target.value = '';
  };

  // ---------- Drawing Masa ----------
  // mood: 'pout' (cheeky duck face), 'happy', 'yuck'
  function drawMasa(g, x, y, s, mood, t){
    g.save(); g.translate(x, y); g.scale(s, s);
    const bob = Math.sin(t * 6) * 1.5;

    // body: white t-shirt
    g.fillStyle = '#fbfaff'; g.strokeStyle = '#d9d3ea'; g.lineWidth = 3;
    g.beginPath();
    g.moveTo(-48, 120); g.quadraticCurveTo(-52, 62, -20, 52);
    g.lineTo(20, 52); g.quadraticCurveTo(52, 62, 48, 120); g.closePath();
    g.fill(); g.stroke();
    // little arms
    g.fillStyle = '#f2c4a8';
    g.beginPath(); g.ellipse(-50, 92 + bob, 9, 12, 0.3, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(50, 92 - bob, 9, 12, -0.3, 0, Math.PI*2); g.fill();
    // neck
    g.fillStyle = '#efbfa3'; g.fillRect(-11, 38, 22, 18);

    if (photo) {
      g.save(); g.beginPath(); g.arc(0, 0, 50, 0, Math.PI*2); g.clip();
      g.drawImage(photo, -50, -50, 100, 100); g.restore();
      g.lineWidth = 5; g.strokeStyle = '#fff'; g.beginPath(); g.arc(0, 0, 50, 0, Math.PI*2); g.stroke();
      // green hair clip still on top
      clip(g, -22, -52);
      g.restore(); return;
    }

    // hair back + curls
    g.fillStyle = '#2b1c17';
    g.beginPath(); g.ellipse(0, -6, 54, 54, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#2b1c17'; g.lineWidth = 2.5; g.lineCap = 'round';
    for (let i = 0; i < 7; i++) {
      const a = -2.6 + i * 0.35, r = 54;
      g.beginPath(); g.moveTo(Math.cos(a)*r, Math.sin(a)*r - 6);
      g.quadraticCurveTo(Math.cos(a)*(r+12) + Math.sin(t*3+i)*3, Math.sin(a)*(r+12) - 6, Math.cos(a+0.12)*(r+16), Math.sin(a+0.12)*(r+16) - 6);
      g.stroke();
    }
    // two buns
    g.beginPath(); g.arc(-28, -50, 17, 0, Math.PI*2); g.fill();
    g.beginPath(); g.arc(30, -48, 16, 0, Math.PI*2); g.fill();

    // ears + gold hoops
    g.fillStyle = '#f0c0a3';
    g.beginPath(); g.ellipse(-45, 6, 8, 11, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(45, 6, 8, 11, 0, 0, Math.PI*2); g.fill();
    g.strokeStyle = '#e0a93a'; g.lineWidth = 2.5;
    g.beginPath(); g.arc(-46, 19, 4, 0, Math.PI*2); g.stroke();
    g.beginPath(); g.arc(46, 19, 4, 0, Math.PI*2); g.stroke();

    // face
    g.fillStyle = '#f6cdb3';
    g.beginPath(); g.ellipse(0, 4, 42, 44, 0, 0, Math.PI*2); g.fill();
    // fringe
    g.fillStyle = '#2b1c17';
    g.beginPath(); g.moveTo(-42, -2); g.quadraticCurveTo(-30, -44, 0, -42); g.quadraticCurveTo(30, -44, 42, -2);
    g.quadraticCurveTo(28, -28, 0, -30); g.quadraticCurveTo(-26, -28, -42, -2); g.fill();

    clip(g, -22, -52);

    // cheeks
    g.fillStyle = 'rgba(255,120,140,.35)';
    g.beginPath(); g.ellipse(-24, 18, 9, 6, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(24, 18, 9, 6, 0, 0, Math.PI*2); g.fill();

    // eyes
    const blink = (Math.sin(t * 1.3) > 0.985);
    g.fillStyle = '#2a1712'; g.strokeStyle = '#2a1712'; g.lineWidth = 2.5;
    if (mood === 'happy' || blink) {
      g.beginPath(); g.arc(-15, 2, 7, Math.PI*1.1, Math.PI*1.9); g.stroke();
      g.beginPath(); g.arc(15, 2, 7, Math.PI*1.1, Math.PI*1.9); g.stroke();
    } else if (mood === 'yuck') {
      g.beginPath(); g.moveTo(-21,-2); g.lineTo(-10,3); g.lineTo(-21,7); g.stroke();
      g.beginPath(); g.moveTo(21,-2); g.lineTo(10,3); g.lineTo(21,7); g.stroke();
    } else {
      // cheeky: one eye a bit squinted, like the photo
      g.beginPath(); g.ellipse(-15, 2, 6, 7, 0, 0, Math.PI*2); g.fill();
      g.beginPath(); g.ellipse(15, 3, 6, 5.5, 0, 0, Math.PI*2); g.fill();
      g.fillStyle = '#fff';
      g.beginPath(); g.arc(-13, -1, 2, 0, Math.PI*2); g.fill();
      g.beginPath(); g.arc(17, 1, 1.8, 0, Math.PI*2); g.fill();
      // eyeliner wings
      g.beginPath(); g.moveTo(-21, -3); g.lineTo(-25, -6); g.stroke();
      g.beginPath(); g.moveTo(21, -2); g.lineTo(25, -5); g.stroke();
    }
    // nose
    g.fillStyle = 'rgba(190,110,90,.55)';
    g.beginPath(); g.ellipse(-3, 15, 2, 1.6, 0, 0, Math.PI*2); g.fill();
    g.beginPath(); g.ellipse(3, 15, 2, 1.6, 0, 0, Math.PI*2); g.fill();

    // mouth
    g.fillStyle = '#e8828f'; g.strokeStyle = '#c95f6f'; g.lineWidth = 2;
    if (mood === 'happy') {
      g.beginPath(); g.arc(0, 24, 11, 0.1, Math.PI-0.1); g.closePath(); g.fill();
    } else if (mood === 'yuck') {
      g.beginPath(); g.moveTo(-10, 30); g.quadraticCurveTo(-4, 24, 0, 30); g.quadraticCurveTo(4, 36, 10, 29); g.stroke();
      g.fillStyle = '#ff8fa6'; g.beginPath(); g.ellipse(3, 33, 4, 5, 0, 0, Math.PI*2); g.fill();
    } else {
      // famous duck-face pout pushed to one side
      g.beginPath(); g.ellipse(3, 25, 11, 6.5, -0.15, 0, Math.PI*2); g.fill(); g.stroke();
      g.beginPath(); g.moveTo(-7, 25); g.quadraticCurveTo(3, 23, 13, 24); g.stroke();
    }
    g.restore();
  }
  function clip(g, x, y){
    g.save(); g.translate(x, y); g.rotate(-0.3);
    g.fillStyle = '#7fd321'; g.strokeStyle = '#4f9a0c'; g.lineWidth = 2;
    g.beginPath(); g.ellipse(-7, 0, 9, 7, -0.4, 0, Math.PI*2); g.fill(); g.stroke();
    g.beginPath(); g.ellipse(7, 0, 9, 7, 0.4, 0, Math.PI*2); g.fill(); g.stroke();
    g.beginPath(); g.arc(0, 0, 4.5, 0, Math.PI*2); g.fill(); g.stroke();
    g.restore();
  }

  const av = $('avatar').getContext('2d');
  function drawAvatar(){
    av.clearRect(0, 0, 300, 300);
    av.fillStyle = '#ffe1ef'; av.beginPath(); av.arc(150, 150, 146, 0, Math.PI*2); av.fill();
    drawMasa(av, 150, 125, 1.45, 'pout', performance.now()/1000);
    $('photoBtn').textContent = photo ? '🎨 رجّع الرسمة الكرتون' : '📷 حط صورة ماسة الحقيقية';
  }

  // ---------- Sound ----------
  let actx = null, muted = store.get('masa-mute') === '1';
  $('muteBtn').textContent = muted ? '🔇' : '🔊';
  $('muteBtn').onclick = () => { muted = !muted; store.set('masa-mute', muted ? '1':'0'); $('muteBtn').textContent = muted ? '🔇' : '🔊'; };
  function beep(freqs, dur = 0.09, type = 'sine', vol = 0.15){
    if (muted) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      let t = actx.currentTime;
      freqs.forEach(f => {
        const o = actx.createOscillator(), gn = actx.createGain();
        o.type = type; o.frequency.value = f;
        gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + dur);
        o.connect(gn).connect(actx.destination); o.start(t); o.stop(t + dur); t += dur * 0.8;
      });
    } catch(e){}
  }
  const sfx = {
    yum: () => beep([660, 880], 0.08, 'triangle'),
    gem: () => beep([784, 988, 1175, 1568], 0.08, 'triangle'),
    yuck: () => beep([220, 160], 0.14, 'square', 0.08),
    over: () => beep([523, 392, 330, 262], 0.16, 'triangle'),
    lvl: () => beep([523, 659, 784], 0.07, 'sine')
  };

  // ---------- Game state ----------
  const GOOD = [
    {e:'🍭', p:10}, {e:'🍬', p:10}, {e:'🍫', p:15}, {e:'🍓', p:10},
    {e:'🧁', p:15}, {e:'🍩', p:15}, {e:'🍦', p:20}
  ];
  const BAD = ['🥦', '🧅', '🌶️', '🥬'];
  const YUM = ['يمّي!', 'حلو!', 'هااا!', 'كمان!', 'جامد!'];
  const EW = ['إيييع!', 'لأ لأ!', 'مش بحبه!', 'يععع!'];

  let state = 'menu', score = 0, lives = 3, level = 1, best = +(store.get('masa-best') || 0);
  let items = [], pops = [], sparks = [], spawnT = 0, t = 0, moodT = 0, mood = 'pout', shake = 0, combo = 0;
  const masa = { x: 0, tx: 0, y: 0, s: 1 };

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    masa.s = Math.max(0.6, Math.min(1, W / 520));
    masa.y = H - 125 * masa.s - Math.max(10, H * 0.03);
    if (!masa.x) masa.x = masa.tx = W / 2;
    masa.x = Math.min(Math.max(masa.x, 55), W - 55); masa.tx = masa.x;
  }
  window.addEventListener('resize', resize); resize();

  // controls
  const setTarget = e => { masa.tx = Math.min(Math.max(e.clientX, 50 * masa.s), W - 50 * masa.s); };
  cv.addEventListener('pointerdown', e => { if (state === 'play') setTarget(e); });
  cv.addEventListener('pointermove', e => { if (state === 'play' && (e.buttons || e.pointerType === 'mouse')) setTarget(e); });
  const keys = {};
  addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ' && state !== 'play') start(); });
  addEventListener('keyup', e => { keys[e.key] = false; });

  function updateHud(){
    $('score').textContent = '⭐ ' + score;
    $('lives').textContent = '❤️'.repeat(lives) + '🤍'.repeat(3 - lives);
  }
  function showBest(){
    const txt = best ? 'أعلى سكور: ' + best : '';
    $('bestStart').textContent = txt; $('bestOver').textContent = txt;
  }

  function start(){
    score = 0; lives = 3; level = 1; items = []; pops = []; sparks = []; spawnT = 0.4; combo = 0; mood = 'pout';
    masa.x = masa.tx = W / 2;
    $('startScreen').classList.add('hidden'); $('overScreen').classList.add('hidden');
    state = 'play'; updateHud();
  }
  function gameOver(){
    state = 'over'; sfx.over();
    const record = score > best;
    if (record) { best = score; store.set('masa-best', best); }
    $('finalScore').textContent = score;
    $('overMsg').textContent = record ? 'رقم قياسي جديد! ماسة بطلة 🏆' :
      score > 150 ? 'ماسة شبعت حلويات 🍭' : 'ماسة عايزة تجرب تاني 😜';
    showBest();
    setTimeout(() => $('overScreen').classList.remove('hidden'), 500);
  }
  $('playBtn').onclick = start; $('againBtn').onclick = start;
  $('homeBtn').onclick = () => { $('overScreen').classList.add('hidden'); $('startScreen').classList.remove('hidden'); state = 'menu'; drawAvatar(); };

  function spawn(){
    const r = Math.random(), badChance = Math.min(0.22 + level * 0.03, 0.42);
    let it;
    if (r < 0.035) it = { e:'💎', p:50, kind:'gem' };
    else if (r < 0.055 && lives < 3) it = { e:'❤️', p:0, kind:'heart' };
    else if (r < 0.055 + badChance) it = { e: BAD[Math.random()*BAD.length|0], kind:'bad' };
    else { const gd = GOOD[Math.random()*GOOD.length|0]; it = { e: gd.e, p: gd.p, kind:'good' }; }
    const size = Math.max(34, Math.min(52, W / 11));
    it.size = size;
    it.x = size/2 + Math.random() * (W - size);
    it.y = -size;
    it.vy = (140 + level * 22 + Math.random() * 60) * (H / 800 + 0.25);
    it.rot = Math.random() * 6; it.vr = (Math.random() - 0.5) * 3;
    it.wob = Math.random() * 6;
    items.push(it);
  }

  function pop(x, y, text, color){ pops.push({ x, y, text, color, life: 1 }); }
  function burst(x, y, colors){
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 180;
      sparks.push({ x, y, vx: Math.cos(a)*v, vy: Math.sin(a)*v - 80, life: 1, c: colors[i % colors.length] });
    }
  }

  function update(dt){
    t += dt;
    if (state !== 'play') return;

    if (keys.ArrowLeft || keys.a) masa.tx = Math.max(50*masa.s, masa.tx - 600*dt);
    if (keys.ArrowRight || keys.d) masa.tx = Math.min(W - 50*masa.s, masa.tx + 600*dt);
    masa.x += (masa.tx - masa.x) * Math.min(1, dt * 14);

    spawnT -= dt;
    if (spawnT <= 0) { spawn(); spawnT = Math.max(0.32, 0.95 - level * 0.07) * (0.7 + Math.random() * 0.6); }

    const newLevel = 1 + Math.floor(score / 120);
    if (newLevel > level) { level = newLevel; sfx.lvl(); pop(W/2, H*0.35, 'مستوى ' + level + ' 🚀', '#5cae0c'); }

    const mx = masa.x, my = masa.y, rad = 48 * masa.s;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy * dt; it.rot += it.vr * dt; it.wob += dt * 3;
      const ix = it.x + Math.sin(it.wob) * 8;
      const dx = ix - mx, dy = it.y - my;
      if (dx*dx + dy*dy < (rad + it.size*0.4) ** 2) {
        items.splice(i, 1);
        if (it.kind === 'bad') {
          lives--; combo = 0; mood = 'yuck'; moodT = 0.8; shake = 0.35; sfx.yuck();
          pop(ix, it.y - 20, EW[Math.random()*EW.length|0], '#d94040');
          if (navigator.vibrate) try { navigator.vibrate(80); } catch(e){}
          if (lives <= 0) { updateHud(); gameOver(); return; }
        } else if (it.kind === 'heart') {
          lives = Math.min(3, lives + 1); sfx.gem(); mood = 'happy'; moodT = 0.6;
          pop(ix, it.y - 20, '+❤️', '#e2508f'); burst(ix, it.y, ['#ff6b8b', '#ffd1dc']);
        } else {
          combo++;
          const bonus = combo >= 5 ? 2 : 1, pts = it.p * bonus;
          score += pts; mood = 'happy'; moodT = 0.45;
          if (it.kind === 'gem') { sfx.gem(); burst(ix, it.y, ['#7fe3ff', '#ffffff', '#f5c542']); pop(ix, it.y - 20, 'ماسة! +' + pts, '#1aa3d9'); }
          else { sfx.yum(); burst(ix, it.y, ['#ff7eb6', '#ffd166', '#8fdc2a']); pop(ix, it.y - 20, (bonus > 1 ? '×٢ ' : '') + YUM[Math.random()*YUM.length|0] + ' +' + pts, '#e2508f'); }
        }
        updateHud();
        continue;
      }
      if (it.y > H + it.size) {
        items.splice(i, 1);
        if (it.kind === 'good' || it.kind === 'gem') combo = 0;
      }
    }
    if (moodT > 0) { moodT -= dt; if (moodT <= 0) mood = 'pout'; }
    if (shake > 0) shake -= dt;
  }

  function drawBg(){
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#bfe7ff'); g.addColorStop(1, '#ffe3f1');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    // drifting clouds
    ctx.fillStyle = 'rgba(255,255,255,.8)';
    for (let i = 0; i < 4; i++) {
      const cx = ((t * (12 + i*6) + i * W/3) % (W + 200)) - 100, cy = 70 + i * H * 0.13;
      ctx.beginPath(); ctx.arc(cx, cy, 26, 0, Math.PI*2); ctx.arc(cx + 28, cy - 10, 32, 0, Math.PI*2); ctx.arc(cx + 58, cy, 24, 0, Math.PI*2); ctx.fill();
    }
    // grass + flowers
    ctx.fillStyle = '#9fe06a'; ctx.fillRect(0, H - 40, W, 40);
    ctx.fillStyle = '#86cc4f'; ctx.fillRect(0, H - 40, W, 6);
    for (let x = 20; x < W; x += 70) {
      ctx.fillStyle = ['#ff7eb6', '#ffd166', '#fff'][(x/70|0) % 3];
      ctx.beginPath(); ctx.arc(x, H - 18, 5, 0, Math.PI*2); ctx.fill();
    }
  }

  function render(){
    ctx.save();
    if (shake > 0) ctx.translate((Math.random()-0.5) * 12 * shake / 0.35, (Math.random()-0.5) * 8 * shake / 0.35);
    drawBg();

    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const it of items) {
      ctx.save(); ctx.translate(it.x + Math.sin(it.wob) * 8, it.y); ctx.rotate(Math.sin(it.rot) * 0.4);
      if (it.kind === 'gem') { ctx.shadowColor = '#7fe3ff'; ctx.shadowBlur = 20; }
      ctx.font = it.size + 'px serif'; ctx.fillText(it.e, 0, 0);
      ctx.restore();
    }

    // shadow + Masa
    ctx.fillStyle = 'rgba(0,0,0,.12)';
    ctx.beginPath(); ctx.ellipse(masa.x, masa.y + 122 * masa.s, 46 * masa.s, 8 * masa.s, 0, 0, Math.PI*2); ctx.fill();
    const tilt = Math.max(-0.2, Math.min(0.2, (masa.tx - masa.x) / 300));
    ctx.save(); ctx.translate(masa.x, masa.y); ctx.rotate(tilt);
    drawMasa(ctx, 0, 0, masa.s, state === 'play' ? mood : 'pout', t);
    ctx.restore();

    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i]; p.life -= 1/60 * 1.6; p.vy += 400/60; p.x += p.vx/60; p.y += p.vy/60;
      if (p.life <= 0) { sparks.splice(i, 1); continue; }
      ctx.globalAlpha = p.life; ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.font = "26px 'Lalezar', cursive";
    for (let i = pops.length - 1; i >= 0; i--) {
      const p = pops[i]; p.life -= 1/60 * 0.9; p.y -= 0.8;
      if (p.life <= 0) { pops.splice(i, 1); continue; }
      ctx.globalAlpha = Math.min(1, p.life * 2);
      ctx.lineWidth = 5; ctx.strokeStyle = '#fff'; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    update(dt); render();
    if (state === 'menu') drawAvatar();
    requestAnimationFrame(loop);
  }
  showBest(); updateHud(); drawAvatar();
  requestAnimationFrame(loop);
})();
</script>
</body>
